[project]
name = "netwatch-ml"
version = "0.1.0"
description = "Offline training and evaluation for netwatch Diagnose. Never shipped to users."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["pandas>=2.2", "scikit-learn>=1.5", "lightgbm>=4.3", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netwatch_ml"]
